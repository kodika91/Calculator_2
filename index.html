<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Momo – a te kis kalandtársad</title><style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;background:linear-gradient(#fff5fb,#eef8ff);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#4c4662}.app{max-width:460px;margin:auto;padding:12px 12px 96px}.logo{font-size:34px;font-weight:900;color:#6c55bf;text-shadow:3px 3px #ffc8dc;padding:4px 8px}.tag{font-size:13px;font-weight:700;color:#746d84;padding:0 8px 10px}.card{overflow:hidden;border-radius:30px;background:#fff;box-shadow:0 20px 50px #6d5a7c30}.scene{height:610px;position:relative;overflow:hidden;background:linear-gradient(#b9e6ff 0 28%,#f8dec8 28% 64%,#d7aa7b 64%)}.scene:before{content:"";position:absolute;inset:0;background:linear-gradient(120deg,#fff8,transparent 40%)}.window{position:absolute;left:50%;top:120px;transform:translateX(-50%);width:190px;height:180px;border-radius:50% 50% 20px 20px;background:linear-gradient(#c9ecff 0 58%,#9ad08c 58%);border:11px solid #a9744e;box-shadow:inset 0 0 0 4px #f6d6af,0 10px 30px #0002}.window:before,.window:after{content:"";position:absolute;background:#a9744e}.window:before{width:8px;top:0;bottom:0;left:50%}.window:after{height:8px;left:0;right:0;top:51%}.plant{position:absolute;right:25px;top:220px;font-size:70px}.bed{position:absolute;left:-15px;bottom:75px;width:190px;height:90px;border-radius:24px;background:#f0d6b5;box-shadow:inset 0 0 0 10px #e0b78d}.bed:after{content:"";position:absolute;inset:14px 12px 18px 36px;border-radius:16px;background:repeating-linear-gradient(90deg,#89b883 0 18px,#f7ead4 18px 36px)}.mush{position:absolute;right:-6px;bottom:76px;font-size:82px}.rug{position:absolute;left:50%;bottom:54px;transform:translateX(-50%);width:245px;height:86px;border-radius:50%;background:#efdbbe;box-shadow:inset 0 0 0 9px #fff1da,inset 0 0 0 14px #d2aa82}.hud{position:absolute;z-index:7;top:12px;left:12px;right:12px;display:flex;justify-content:space-between;gap:8px}.profile,.pill,.status{background:#fffef4eb;backdrop-filter:blur(8px);box-shadow:0 6px 18px #5c50631d}.profile{display:flex;align-items:center;gap:9px;border-radius:20px;padding:7px 10px 7px 7px}.avatar{width:48px;height:48px;border-radius:50%;border:4px solid #7ac4ef;background:linear-gradient(145deg,#d4f2ff,#fff5c7);display:grid;place-items:center;font-weight:900}.pname{font-size:20px;font-weight:900}.lvl{font-size:12px;color:#858092;font-weight:700}.xp{width:118px;height:7px;border-radius:9px;background:#e8e5ec;margin-top:5px}.xp:after{content:"";display:block;width:38%;height:100%;border-radius:9px;background:#f1c542}.right{display:grid;gap:7px;justify-items:end}.pill{border-radius:16px;padding:7px 10px;font-weight:900}.status{position:absolute;z-index:7;left:14px;top:96px;width:166px;border-radius:18px;padding:9px 10px}.row{display:grid;grid-template-columns:22px 1fr;gap:6px;margin:6px 0;align-items:center}.lab{font-size:12px;font-weight:900}.bar{height:7px;background:#ece8ef;border-radius:8px;overflow:hidden}.fill{height:100%;border-radius:8px}.stage{position:absolute;z-index:5;left:50%;bottom:105px;transform:translateX(-50%);width:280px;height:285px;display:grid;place-items:center}.egg{width:170px;height:210px;animation:float 1.8s ease-in-out infinite;filter:drop-shadow(0 14px 10px #4f425533);cursor:pointer}.egg svg,.pet svg{width:100%;height:100%}@keyframes float{50%{transform:translateY(-8px) rotate(2deg)}}@keyframes shake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}.glow{position:absolute;width:190px;height:70px;bottom:15px;border-radius:50%;background:radial-gradient(ellipse,#fff6b9bb,transparent 70%);filter:blur(6px)}.pet{width:225px;height:225px;animation:float 3s ease-in-out infinite;filter:drop-shadow(0 12px 8px #4f425533)}.bubble{position:absolute;right:-15px;top:67px;background:#fffdfbea;border-radius:20px 20px 20px 6px;padding:9px 12px;font-size:12px;font-weight:900;max-width:120px;box-shadow:0 6px 16px #0002}.hint{position:absolute;z-index:8;left:50%;bottom:78px;transform:translateX(-50%);background:#fffdfbea;padding:9px 13px;border-radius:17px;font-size:13px;font-weight:900;white-space:nowrap}.hidden{display:none!important}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:12px;background:#f8e5cb}.btn{border:0;border-radius:18px;padding:11px 4px 9px;font-weight:900;color:#504861;font-size:12px;box-shadow:inset 0 -3px #0001}.btn b{display:block;font-size:24px;margin-bottom:3px}.feed{background:#ff9c9c}.play{background:#ffd967}.sleep{background:#a78beb}.explore{background:#75d887}.info{padding:12px 14px;background:#fff}.panel{background:#fbf6ff;border-radius:18px;padding:12px 14px}.panel h3{margin:0 0 4px}.small{font-size:12px;color:#7c768d}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;font-weight:800;background:#eee7fa;border-radius:12px;padding:6px 9px}.reset{margin-top:10px;border:0;border-radius:14px;padding:9px 12px;background:#8268d7;color:#fff;font-weight:900}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(460px,100%);padding:7px 12px calc(7px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 30%)}.nav{display:grid;grid-template-columns:repeat(5,1fr);background:#fff;border-radius:22px;padding:8px 5px;box-shadow:0 8px 25px #0002}.nav div{text-align:center;font-size:10px;font-weight:800;color:#8e8997}.nav b{display:block;font-size:20px}.nav .active{color:#7556d1}.toast{position:fixed;z-index:50;top:18px;left:50%;transform:translate(-50%,-20px);background:#50445f;color:#fff;padding:10px 14px;border-radius:16px;opacity:0;transition:.2s}.toast.show{opacity:1;transform:translate(-50%,0)}
</style></head><body><div class="toast" id="toast"></div><main class="app"><div class="logo">Momo ♡</div><div class="tag">a te kis kalandtársad</div><section class="card"><div class="scene"><div class="window"></div><div class="plant">🌿</div><div class="bed"></div><div class="mush">🍄</div><div class="rug"></div><div class="hud"><div class="profile"><div class="avatar">✦</div><div><div class="pname" id="pname">Momo</div><div class="lvl">Szint 1</div><div class="xp"></div></div></div><div class="right"><div class="pill">◉ <span id="coins">120</span></div><div class="pill">▣ <span id="day">1</span>. nap</div></div></div><div class="status"><div class="row">●<div><div class="lab">Éhség</div><div class="bar"><div id="hunger" class="fill" style="background:#ef7d83"></div></div></div></div><div class="row">☺<div><div class="lab">Boldogság</div><div class="bar"><div id="happy" class="fill" style="background:#efc43f"></div></div></div></div><div class="row">ϟ<div><div class="lab">Energia</div><div class="bar"><div id="energy" class="fill" style="background:#55afe5"></div></div></div></div><div class="row">❧<div><div class="lab">Kíváncsiság</div><div class="bar"><div id="curious" class="fill" style="background:#65c779"></div></div></div></div></div><div class="stage"><div id="glow" class="glow"></div><div id="egg" class="egg"><svg viewBox="0 0 150 190"><defs><linearGradient id="eg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#fff8ff"/><stop offset=".45" stop-color="#d9c8ff"/><stop offset="1" stop-color="#9fdcff"/></linearGradient></defs><path d="M75 7C48 7 22 49 22 98c0 49 24 80 53 80s53-31 53-80C128 49 102 7 75 7z" fill="url(#eg)" stroke="#fff" stroke-width="5"/><path d="M42 112c17-18 34-23 50-17 10 4 18 11 27 18-16 2-27 9-36 20-12-11-26-17-41-21z" fill="#987be5" opacity=".48"/><path d="M75 27l7 14 15 2-11 10 3 15-14-7-14 7 3-15-11-10 15-2z" fill="#fff1a8" stroke="#fff" stroke-width="2"/><ellipse cx="52" cy="61" rx="12" ry="19" fill="#fff" opacity=".42"/></svg></div><div id="pet" class="pet hidden"></div><div id="bubble" class="bubble hidden"></div></div><div id="hint" class="hint">Koppints a tojásra ✨</div></div><div class="actions"><button class="btn feed" data-a="feed"><b>🥣</b>Etetés</button><button class="btn play" data-a="play"><b>🎾</b>Játék</button><button class="btn sleep" data-a="sleep"><b>🌙</b>Alvás</button><button class="btn explore" data-a="explore"><b>🗺️</b>Felfedezés</button></div><div class="info"><div class="panel"><h3 id="title">A tojás még alszik…</h3><div id="desc" class="small">Belőle egy teljesen egyedi, nem létező fantasy lény fog kikelni.</div><div id="chips" class="chips"></div><button id="reset" class="reset">Új tojás / teszt reset</button></div></div></section></main><div class="bottom"><div class="nav"><div class="active"><b>🏠</b>Home</div><div><b>🎮</b>Játékok</div><div><b>🗺️</b>Világ</div><div><b>👥</b>Barátok</div><div><b>🛍️</b>Bolt</div></div></div><script>
const $=i=>document.getElementById(i),pick=a=>a[Math.random()*a.length|0],clamp=n=>Math.max(0,Math.min(100,n));const pal=[['#f7c7ef','#8a66d8','#fff0a8'],['#bdf3ee','#4d99c7','#fff1ba'],['#ffd2b9','#d96c9f','#fff4cd'],['#c8c1ff','#6f5bc4','#9ef2d0'],['#d1f0b1','#5c9c86','#fff2bf'],['#b8d8ff','#476dba','#f5c3ff']],tr=['kíváncsi','álmodozó','huncut','bújós','bátor','játékos','nyugodt','éjjeli'],rar=['Gyakori','Gyakori','Ritka','Ritka','Epikus','Legendás','Mitikus'];function gen(){return{name:pick(['Lumi','Nira','Kivo','Zeli','Miri','Aru','Vexa','Nori'])+(10+Math.random()*89|0),rar:pick(rar),tr:[pick(tr),pick(tr)],p:pick(pal),body:Math.random()*3|0,eye:Math.random()*4|0,horn:Math.random()*4|0,tail:Math.random()*4|0}}function petSVG(c){let[a,b,h]=c.p,body=['M58 77Q48 121 64 158Q106 187 148 158Q164 121 154 77Q128 52 106 57Q84 52 58 77Z','M55 91Q65 55 106 56Q147 55 157 91L151 155Q106 181 61 155Z','M65 67Q106 43 147 67Q166 106 149 157Q106 181 63 157Q46 106 65 67Z'][c.body],eyes=['<circle cx="87" cy="108" r="12" fill="#302744"/><circle cx="127" cy="108" r="12" fill="#302744"/><circle cx="83" cy="103" r="4" fill="#fff"/><circle cx="123" cy="103" r="4" fill="#fff"/>','<ellipse cx="87" cy="108" rx="10" ry="16" fill="#302744"/><ellipse cx="127" cy="108" rx="10" ry="16" fill="#302744"/><circle cx="84" cy="102" r="3" fill="#fff"/><circle cx="124" cy="102" r="3" fill="#fff"/>','<path d="M77 109Q87 97 97 109M117 109Q127 97 137 109" fill="none" stroke="#302744" stroke-width="6" stroke-linecap="round"/>','<path d="M87 94l4 9 10 1-8 6 3 10-9-5-9 5 3-10-8-6 10-1z" fill="#302744"/><circle cx="127" cy="108" r="11" fill="#302744"/>'][c.eye],horn=['','<path d="M82 69L68 38L93 59M130 69L145 38L119 59" fill="'+h+'" stroke="'+b+'" stroke-width="5"/>','<circle cx="106" cy="46" r="13" fill="'+h+'"/><path d="M106 46V69" stroke="'+b+'" stroke-width="5"/>','<path d="M78 67Q61 46 52 67Q69 65 83 79M134 67Q151 46 160 67Q143 65 129 79" fill="'+h+'" stroke="'+b+'" stroke-width="5"/>'][c.horn],tail=['','<path d="M149 145Q191 129 183 96Q207 120 187 156Q168 170 149 159" fill="'+b+'"/>','<path d="M150 148Q188 158 181 184Q164 170 149 162" fill="none" stroke="'+b+'" stroke-width="12" stroke-linecap="round"/>','<path d="M151 146Q188 132 192 151Q173 158 153 165" fill="'+h+'" stroke="'+b+'" stroke-width="5"/>'][c.tail];return'<svg viewBox="0 0 212 212">'+tail+'<ellipse cx="106" cy="176" rx="50" ry="12" fill="#392c4618"/>'+horn+'<path d="'+body+'" fill="'+a+'" stroke="'+b+'" stroke-width="6"/>'+eyes+'<path d="M99 130Q106 136 113 130" fill="none" stroke="#533e59" stroke-width="4" stroke-linecap="round"/><circle cx="72" cy="122" r="7" fill="#ff9eb7" opacity=".5"/><circle cx="140" cy="122" r="7" fill="#ff9eb7" opacity=".5"/></svg>'}let D={hatched:false,creature:null,stats:{hunger:72,happy:62,energy:78,curious:48},coins:120,day:1},S=(()=>{try{return Object.assign(structuredClone(D),JSON.parse(localStorage.momoSave||'{}'))}catch{return structuredClone(D)}})(),egg=$('egg'),eggHTML=egg.innerHTML;function save(){localStorage.momoSave=JSON.stringify(S)}function render(){$('coins').textContent=S.coins;$('day').textContent=S.day;['hunger','happy','energy','curious'].forEach(k=>$(k).style.width=S.stats[k]+'%');if(S.hatched&&S.creature){egg.classList.add('hidden');$('pet').classList.remove('hidden');$('bubble').classList.remove('hidden');$('hint').classList.add('hidden');$('pet').innerHTML=petSVG(S.creature);$('bubble').textContent=S.creature.name+' ♡';$('pname').textContent=S.creature.name;$('title').textContent=S.creature.name+' – '+S.creature.rar;$('desc').textContent='Egyedi, procedurálisan generált fantasy társ.';$('chips').innerHTML=S.creature.tr.map(x=>'<span class="chip">'+x+'</span>').join('')}else{egg.classList.remove('hidden');egg.innerHTML=eggHTML;egg.style.animation='';$('pet').classList.add('hidden');$('bubble').classList.add('hidden');$('hint').classList.remove('hidden');$('hint').textContent='Koppints a tojásra ✨';$('pname').textContent='Momo';$('title').textContent='A tojás még alszik…';$('desc').textContent='Belőle egy teljesen egyedi, nem létező fantasy lény fog kikelni.';$('chips').innerHTML=''}save()}function toast(t){let e=$('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1500)}function hatch(){if(S.hatched||egg.dataset.busy)return;egg.dataset.busy=1;egg.style.animation='shake .14s ease-in-out infinite';$('hint').textContent='Mindjárt kikel… ✨';setTimeout(()=>{S.creature=gen();S.hatched=true;S.stats={hunger:80,happy:82,energy:88,curious:60};delete egg.dataset.busy;render();toast('Kikelt '+S.creature.name+'! ♡')},1300)}egg.onclick=hatch;$('hint').onclick=hatch;$('reset').onclick=()=>{S=structuredClone(D);localStorage.removeItem('momoSave');render();toast('Új tojás érkezett ✨')};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!S.hatched)return toast('Előbb keltesd ki a tojást!');let a=b.dataset.a;if(a==='feed')S.stats.hunger=clamp(S.stats.hunger+18);if(a==='play'){S.stats.happy=clamp(S.stats.happy+18);S.stats.energy=clamp(S.stats.energy-8)}if(a==='sleep')S.stats.energy=clamp(S.stats.energy+26);if(a==='explore'){S.stats.curious=clamp(S.stats.curious+14);S.coins+=5}render();toast('Momo örül neki! ♡')});render();
