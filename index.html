<!doctype html><html lang="hu"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="apple-mobile-web-app-capable" content="yes"><title>Momo – a te kis kalandtársad</title><style>:root{--ink:#443653;--glass:#ffffffd9}*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:linear-gradient(#fff4fb,#eef5ff);min-height:100vh}.app{max-width:480px;margin:auto;padding:10px 14px 100px}.top{display:flex;justify-content:space-between;align-items:center}.logo{font-size:34px;font-weight:900;color:#7559c7;text-shadow:0 2px #ffcbe0}.sub{font-size:12px;color:#82798f}.coin{background:white;padding:9px 13px;border-radius:18px;box-shadow:0 8px 22px #70558022}.room{position:relative;height:520px;overflow:hidden;border-radius:32px;background:linear-gradient(180deg,#8ca6e8 0,#c8b9ef 28%,#f6cfe7 49%,#ffdcb7 66%,#d5a477 66%,#b77f58 100%);box-shadow:0 22px 55px #60457235;border:1px solid #ffffffcc}.room:before{content:"";position:absolute;left:50%;top:48px;width:240px;height:240px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(circle at 50% 42%,#fff 0 25%,#def6ff 26% 43%,#91b5ef 44% 50%,#725aa9 51% 56%,transparent 57%);box-shadow:0 0 55px #fff9}.room:after{content:"✦  ·  ✧  ·  ✦";position:absolute;top:18px;left:50%;transform:translateX(-50%);white-space:nowrap;color:#fff6c8;font-size:22px;letter-spacing:8px;text-shadow:0 0 12px white;animation:tw 2.4s ease-in-out infinite}@keyframes tw{50%{opacity:.45;transform:translateX(-50%) translateY(-3px)}}.mount{position:absolute;left:-8%;right:-8%;bottom:31%;height:110px;background:linear-gradient(135deg,#736aa5,#9f79ae);clip-path:polygon(0 100%,0 65%,15% 30%,28% 58%,43% 18%,55% 59%,72% 25%,86% 55%,100% 17%,100% 100%);opacity:.45}.floor{position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(#d1a072,#b87e55)}.rug{position:absolute;left:50%;bottom:65px;width:240px;height:76px;transform:translateX(-50%);border-radius:50%;background:#f6d9db;box-shadow:inset 0 0 0 8px #fff5}.spark{position:absolute;font-size:22px;color:white;text-shadow:0 0 12px #fff}.s1{left:26px;top:190px}.s2{right:28px;top:228px}.s3{right:84px;top:118px}.status{position:absolute;left:14px;top:14px;width:158px;padding:10px;border-radius:20px;background:var(--glass);backdrop-filter:blur(9px);z-index:5}.st{display:grid;grid-template-columns:22px 1fr;gap:5px;margin:6px 0;font-size:11px;font-weight:700}.bar{height:7px;background:#ece7f3;border-radius:10px;overflow:hidden;margin-top:3px}.fill{height:100%;border-radius:10px}.day{position:absolute;right:14px;top:14px;background:var(--glass);padding:8px 10px;border-radius:15px;font-size:12px;font-weight:800;z-index:5}.stage{position:absolute;left:50%;bottom:73px;width:270px;height:275px;transform:translateX(-50%);display:flex;align-items:center;justify-content:center;z-index:4}.eggGlow{position:absolute;width:200px;height:100px;border-radius:50%;background:radial-gradient(ellipse,#fff9,#cdb7ff55 45%,transparent 70%);bottom:30px;filter:blur(6px)}.egg{width:155px;height:195px;cursor:pointer;animation:bob 1.3s ease-in-out infinite;filter:drop-shadow(0 15px 13px #57456e44)}.egg svg,.pet svg{width:100%;height:100%;display:block}@keyframes bob{50%{transform:translateY(-12px) rotate(3deg)}}@keyframes shake{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}.pet{width:225px;height:225px;filter:drop-shadow(0 16px 11px #4a355044);animation:bob 2s ease-in-out infinite}.name{position:absolute;bottom:3px;background:white;padding:7px 14px;border-radius:17px;font-weight:800;box-shadow:0 5px 14px #0001}.hint{position:absolute;left:50%;bottom:32px;transform:translateX(-50%);background:#ffffffdf;padding:9px 14px;border-radius:16px;font-weight:800;font-size:13px;z-index:6;white-space:nowrap}.hidden{display:none!important}.actions{display:grid;grid-template-columns:repeat(4,1fr);gap:9px;margin:13px 0}.btn{border:0;border-radius:20px;padding:12px 5px;font-weight:800;color:#493b55;box-shadow:0 7px 16px #6b55771f}.btn b{display:block;font-size:24px}.feed{background:#ffb4b2}.play{background:#ffe084}.sleep{background:#c2afff}.explore{background:#9fe3a8}.panel{background:#ffffffdd;padding:15px;border-radius:23px;box-shadow:0 10px 28px #6651741c}.traits{display:flex;gap:6px;flex-wrap:wrap}.chip{background:#f0ebf7;padding:6px 9px;border-radius:13px;font-size:12px;font-weight:700}.reset{width:100%;margin-top:12px;border:0;border-radius:17px;padding:11px;background:#8065d5;color:white;font-weight:800}.bottom{position:fixed;left:50%;bottom:0;transform:translateX(-50%);width:min(480px,100%);padding:10px 14px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 28%)}.nav{display:grid;grid-template-columns:repeat(5,1fr);background:white;border-radius:22px;padding:9px;box-shadow:0 10px 30px #0002}.nav div{text-align:center;font-size:10px;color:#8c8494}.nav b{display:block;font-size:20px}.toast{position:fixed;top:20px;left:50%;transform:translate(-50%,-20px);background:#4a3e58;color:white;padding:10px 14px;border-radius:17px;opacity:0;transition:.2s;z-index:20}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><div class="toast" id="toast"></div><main class="app"><div class="top"><div><div class="logo">Momo ♡</div><div class="sub">a te kis kalandtársad</div></div><div class="coin">🪙 <span id="coins">120</span></div></div><section class="room"><div class="mount"></div><div class="floor"></div><div class="rug"></div><div class="spark s1">✦</div><div class="spark s2">✧</div><div class="spark s3">✦</div><div class="status"><div class="st">🍎<div>Éhség<div class="bar"><div id="hunger" class="fill" style="background:#ef7f85"></div></div></div></div><div class="st">😊<div>Boldogság<div class="bar"><div id="happy" class="fill" style="background:#f2c94c"></div></div></div></div><div class="st">⚡<div>Energia<div class="bar"><div id="energy" class="fill" style="background:#64aef0"></div></div></div></div><div class="st">✨<div>Kíváncsiság<div class="bar"><div id="curious" class="fill" style="background:#6bca7c"></div></div></div></div></div><div class="day">1. nap</div><div class="stage"><div id="eggGlow" class="eggGlow"></div><div id="egg" class="egg"><svg viewBox="0 0 150 190"><defs><linearGradient id="eg" x1="0" x2="1" y2="1"><stop stop-color="#fff8ff"/><stop offset=".48" stop-color="#dccbff"/><stop offset="1" stop-color="#9fdcff"/></linearGradient></defs><path d="M75 7C47 7 21 50 21 100c0 50 24 80 54 80s54-30 54-80C129 50 103 7 75 7z" fill="url(#eg)" stroke="white" stroke-width="5"/><path d="M40 110c18-18 34-22 49-16 11 4 18 12 27 18-16 1-26 8-35 19-13-11-26-17-41-21z" fill="#9c7ee4" opacity=".45"/><path d="M75 27l7 14 15 2-11 10 3 15-14-7-14 7 3-15-11-10 15-2z" fill="#fff1a8" stroke="white" stroke-width="2"/><ellipse cx="53" cy="59" rx="13" ry="19" fill="white" opacity=".42"/></svg></div><div id="pet" class="pet hidden"></div><div id="name" class="name hidden"></div></div><div id="hint" class="hint">Koppints a tojásra ✨</div></section><div class="actions"><button class="btn feed" data-a="feed"><b>🥣</b>Etetés</button><button class="btn play" data-a="play"><b>🎾</b>Játék</button><button class="btn sleep" data-a="sleep"><b>🌙</b>Alvás</button><button class="btn explore" data-a="explore"><b>🗺️</b>Felfedezés</button></div><section class="panel"><h3 id="title">A tojás még alszik…</h3><p id="desc" style="font-size:13px;color:#81778f">Belőle egy teljesen egyedi, nem létező fantasy lény fog kikelni.</p><div id="traits" class="traits"></div><button id="reset" class="reset">Új tojás / teszt reset</button></section></main><div class="bottom"><div class="nav"><div><b>🏠</b>Home</div><div><b>🎮</b>Játékok</div><div><b>🌌</b>Világ</div><div><b>👥</b>Barátok</div><div><b>🛍️</b>Bolt</div></div></div><script>const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)],clamp=n=>Math.max(0,Math.min(100,n));const palettes=[['#f7c7ef','#8a66d8','#fff0a8'],['#bdf3ee','#4d99c7','#fff1ba'],['#ffd2b9','#d96c9f','#fff4cd'],['#c8c1ff','#6f5bc4','#9ef2d0'],['#d1f0b1','#5c9c86','#fff2bf'],['#b8d8ff','#476dba','#f5c3ff']];const rarities=['Gyakori','Gyakori','Ritka','Ritka','Epikus','Legendás','Mitikus'],traits=['kíváncsi','álmodozó','huncut','bújós','bátor','játékos','nyugodt','éjjeli'];function gen(){return{name:pick(['Lumi','Nira','Kivo','Zeli','Miri','Aru','Vexa','Nori'])+Math.floor(Math.random()*90+10),rarity:pick(rarities),traits:[pick(traits),pick(traits)],p:pick(palettes),body:Math.floor(Math.random()*3),eyes:Math.floor(Math.random()*4),horn:Math.floor(Math.random()*4),tail:Math.floor(Math.random()*4)}}function svg(c){let[a,b,h]=c.p;let body=['M60 74Q50 120 65 157Q106 187 147 157Q162 120 152 74Q126 51 106 55Q86 51 60 74Z','M55 91Q65 55 106 56Q147 55 157 91L151 155Q106 181 61 155Z','M65 66Q106 42 147 66Q166 106 149 157Q106 181 63 157Q46 106 65 66Z'][c.body];let eye=['<circle cx="87" cy="108" r="12" fill="#302744"/><circle cx="127" cy="108" r="12" fill="#302744"/><circle cx="83" cy="103" r="4" fill="white"/><circle cx="123" cy="103" r="4" fill="white"/>','<ellipse cx="87" cy="108" rx="10" ry="16" fill="#302744"/><ellipse cx="127" cy="108" rx="10" ry="16" fill="#302744"/><circle cx="84" cy="102" r="3" fill="white"/><circle cx="124" cy="102" r="3" fill="white"/>','<path d="M77 109Q87 97 97 109" fill="none" stroke="#302744" stroke-width="6" stroke-linecap="round"/><path d="M117 109Q127 97 137 109" fill="none" stroke="#302744" stroke-width="6" stroke-linecap="round"/>','<path d="M87 94l4 9 10 1-8 6 3 10-9-5-9 5 3-10-8-6 10-1z" fill="#302744"/><circle cx="127" cy="108" r="11" fill="#302744"/>'][c.eyes];let horn=['','<path d="M82 68L68 37L93 58M130 68L145 37L119 58" fill="'+h+'" stroke="'+b+'" stroke-width="5"/>','<circle cx="106" cy="46" r="13" fill="'+h+'"/><path d="M106 46L106 68" stroke="'+b+'" stroke-width="5"/>','<path d="M78 66Q61 45 52 66Q69 64 83 78M134 66Q151 45 160 66Q143 64 129 78" fill="'+h+'" stroke="'+b+'" stroke-width="5"/>'][c.horn];let tail=['','<path d="M149 145Q191 129 183 96Q207 120 187 156Q168 170 149 159" fill="'+b+'"/>','<path d="M150 148Q188 158 181 184Q164 170 149 162" fill="none" stroke="'+b+'" stroke-width="12" stroke-linecap="round"/>','<path d="M151 146Q188 132 192 151Q173 158 153 165" fill="'+h+'" stroke="'+b+'" stroke-width="5"/>'][c.tail];return'<svg viewBox="0 0 212 212">'+tail+'<ellipse cx="106" cy="176" rx="50" ry="12" fill="#392c4618"/>'+horn+'<path d="'+body+'" fill="'+a+'" stroke="'+b+'" stroke-width="6"/>'+eye+'<path d="M99 130Q106 136 113 130" fill="none" stroke="#533e59" stroke-width="4" stroke-linecap="round"/><circle cx="72" cy="124" r="7" fill="#ff9eb7" opacity=".4"/><circle cx="140" cy="124" r="7" fill="#ff9eb7" opacity=".4"/>'+(c.rarity==='Mitikus'?'<circle cx="106" cy="108" r="90" fill="none" stroke="'+h+'" stroke-width="3" stroke-dasharray="4 10"><animateTransform attributeName="transform" type="rotate" from="0 106 108" to="360 106 108" dur="8s" repeatCount="indefinite"/></circle>':'')+'</svg>'}const D={hatched:false,pet:null,coins:120,stats:{hunger:78,happy:74,energy:82,curious:55}};let s;try{s=JSON.parse(localStorage.getItem('momoV3'))||structuredClone(D)}catch{s=structuredClone(D)}function save(){localStorage.setItem('momoV3',JSON.stringify(s))}function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)}function render(){['hunger','happy','energy','curious'].forEach(k=>$(k).style.width=s.stats[k]+'%');$('coins').textContent=s.coins;if(s.hatched&&s.pet){$('egg').classList.add('hidden');$('eggGlow').classList.add('hidden');$('hint').classList.add('hidden');$('pet').classList.remove('hidden');$('name').classList.remove('hidden');$('pet').innerHTML=svg(s.pet);$('name').textContent=s.pet.name+' ♡';$('title').textContent=s.pet.name+' · '+s.pet.rarity;$('desc').textContent='Egyedi fantasy társ. Kinézete véletlenszerűen generálódott.';$('traits').innerHTML=s.pet.traits.map(x=>'<span class="chip">'+x+'</span>').join('')}else{$('egg').classList.remove('hidden');$('eggGlow').classList.remove('hidden');$('hint').classList.remove('hidden');$('pet').classList.add('hidden');$('name').classList.add('hidden');$('title').textContent='A tojás még alszik…';$('traits').innerHTML=''}save()}function hatch(){if(s.hatched)return;$('egg').style.animation='shake .16s ease-in-out infinite';setTimeout(()=>{s.pet=gen();s.hatched=true;s.stats={hunger:85,happy:88,energy:90,curious:64};render();toast('Kikelt '+s.pet.name+'! ✨')},1450)}$('egg').onclick=hatch;$('hint').onclick=hatch;$('reset').onclick=()=>{s=structuredClone(D);localStorage.removeItem('momoV3');render();toast('Új tojás érkezett ✨')};document.querySelectorAll('[data-a]').forEach(b=>b.onclick=()=>{if(!s.hatched)return toast('Előbb keltesd ki a tojást!');let a=b.dataset.a;if(a==='feed'){s.stats.hunger=clamp(s.stats.hunger+18);s.stats.happy=clamp(s.stats.happy+3)}if(a==='play'){s.stats.happy=clamp(s.stats.happy+18);s.stats.energy=clamp(s.stats.energy-7)}if(a==='sleep'){s.stats.energy=clamp(s.stats.energy+25)}if(a==='explore'){s.stats.curious=clamp(s.stats.curious+15);s.stats.energy=clamp(s.stats.energy-8);s.coins+=5}render();toast('Momo örül neki ♡')});render();</script></body></html>
